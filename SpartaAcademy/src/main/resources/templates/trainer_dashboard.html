<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Trainer Dashboard</title>
</head>

<body class="bg-light">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5">

    <!-- Welcome Section -->
    <div th:replace="~{fragments/welcome :: welcome}"></div>

    <!-- Dashboard Cards -->
    <div class="row justify-content-center g-4">

        <!-- Courses -->
        <div class="col-md-4">

            <div class="card text-center shadow-sm h-100">

                <div class="card-body p-4">

                    <div class="display-3 mb-3">🎓</div>

                    <h3 class="card-title fw-bold">
                        Available Courses
                    </h3>

                    <p class="card-text text-muted">
                        View all available academy courses.
                    </p>

                    <a th:href="@{/trainer/view_courses}"
                       class="btn btn-danger mt-3">
                        View Now
                    </a>

                </div>

            </div>

        </div>

        <!-- Trainees -->
        <div class="col-md-4">

            <div class="card text-center shadow-sm h-100">

                <div class="card-body p-4">

                    <div class="display-3 mb-3">👨‍🎓</div>

                    <h3 class="card-title fw-bold">
                        View Trainees
                    </h3>

                    <p class="card-text text-muted">
                        View all trainee Spartans.
                    </p>

                    <a th:href="@{/trainer/view_trainees}"
                       class="btn btn-danger mt-3">
                        View Now
                    </a>

                </div>

            </div>

        </div>

        <!-- Assign Trainer -->
        <div class="col-md-4">

            <div class="card text-center shadow-sm h-100">

                <div class="card-body p-4">

                    <div class="display-3 mb-3">🧑‍🏫</div>

                    <h3 class="card-title fw-bold">
                        Assign Trainer
                    </h3>

                    <p class="card-text text-muted">
                        Assign trainers to trainees.
                    </p>

                    <a th:href="@{/trainer/assign}"
                       class="btn btn-danger mt-3">
                        Assign Now
                    </a>

                </div>

            </div>

        </div>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
