<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      class="h-100">

<head>
    <meta charset="UTF-8">
    <title>Trainer Dashboard</title>
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

<div th:replace="~{fragments/header :: header}"></div>

<!-- Main Content -->
<main class="flex-grow-1 container py-5">

    <!-- Welcome Section -->
    <div th:replace="~{fragments/welcome :: welcome}"></div>

    <!-- Dashboard Cards -->
    <div class="row justify-content-center g-4">

        <!-- Courses -->
        <div class="col-md-4">

            <div class="card text-center shadow-sm border-0 rounded-4 h-100">

                <div class="card-body p-4">

                    <div class="display-3 mb-3">🎓</div>

                    <h3 class="card-title fw-bold">
                        Available Courses
                    </h3>

                    <p class="card-text text-muted">
                        View all available academy courses.
                    </p>

                    <a th:href="@{/trainer/view_courses}"
                       class="btn btn-danger mt-3 px-4">

                        View Now
                    </a>

                </div>

            </div>

        </div>

        <!-- Trainees -->
        <div class="col-md-4">

            <div class="card text-center shadow-sm border-0 rounded-4 h-100">

                <div class="card-body p-4">

                    <div class="display-3 mb-3">👨‍🎓</div>

                    <h3 class="card-title fw-bold">
                        View Trainees
                    </h3>

                    <p class="card-text text-muted">
                        View all trainee Spartans.
                    </p>

                    <a th:href="@{/trainer/view_trainees}"
                       class="btn btn-danger mt-3 px-4">

                        View Now
                    </a>

                </div>

            </div>

        </div>

        <!-- Assign Trainer -->
        <div class="col-md-4">

            <div class="card text-center shadow-sm border-0 rounded-4 h-100">

                <div class="card-body p-4">

                    <div class="display-3 mb-3">🧑‍🏫</div>

                    <h3 class="card-title fw-bold">
                        Assign Trainees
                    </h3>

                    <p class="card-text text-muted">
                        Enrol and remove trainees from courses
                    </p>

                    <a th:href="@{/trainer/assign}"
                       class="btn btn-danger mt-3 px-4">
                        Manage Now
                    </a>
                </div>
            </div>
        </div>

        <div class="col-md-4">

            <div class="card text-center shadow-sm border-0 rounded-4 h-100">

                <div class="card-body p-4">

                    <div class="display-3 mb-3">
                        👨‍🎓
                    </div>

                    <h3 class="card-title fw-bold">
                        View My Courses
                    </h3>

                    <p class="card-text text-muted">
                        View courses assigned to you.
                    </p>

                    <a th:href="@{/trainer/mycourses}"
                       class="btn btn-danger mt-3 px-4">
                        View Now
                    </a>

                </div>

            </div>

        </div>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
