<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<body class="bg-light">

<div th:replace="~{fragments/header :: header}"></div>

<div class="container py-5">

    <div class="row justify-content-center g-4">

        <div class="col-md-4">
            <div class="card text-center shadow-sm h-100">
                <div class="card-body p-4">

                    <div class="display-3 mb-3">🎓</div>

                    <h3 class="card-title fw-bold">
                        Available Courses
                    </h3>

                    <p class="card-text text-muted">
                        View all the available courses in the academy.
                    </p>

                    <a th:href="@{/trainer/view_courses}"
                       class="btn btn-danger mt-3">
                        View Now
                    </a>

                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card text-center shadow-sm h-100">
                <div class="card-body p-4">

                    <div class="display-3 mb-3">👤</div>

                    <h3 class="card-title fw-bold">
                        View all Trainee Spartans
                    </h3>

                    <p class="card-text text-muted">
                        View all the Spartans.
                    </p>

                    <a th:href="@{/trainer/view_trainees}"
                       class="btn btn-danger mt-3">
                        View Now
                    </a>

                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card text-center shadow-sm h-100">
                <div class="card-body p-4">

                    <div class="display-3 mb-3">👨‍🏫</div>

                    <h3 class="card-title fw-bold">
                        Assign Trainer to Trainee
                    </h3>

                    <p class="card-text text-muted">
                        Assign a trainee with a trainer.
                    </p>

                    <a th:href="@{/trainer/assign_trainee}"
                       class="btn btn-danger mt-3">
                        Assign Now
                    </a>

                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card text-center shadow-sm h-100">
                <div class="card-body p-4">

                    <div class="display-3 mb-3">⚙️</div>

                    <h3 class="card-title fw-bold">
                        User Profile
                    </h3>

                    <p class="card-text text-muted">
                        View and update your trainer profile details.
                    </p>

                    <a th:href="@{/trainer/profile}"
                       class="btn btn-danger mt-3">
                        Access Now
                    </a>

                </div>
            </div>
        </div>

    </div>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
