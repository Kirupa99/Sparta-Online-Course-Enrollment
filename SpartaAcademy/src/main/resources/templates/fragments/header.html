<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<body>

<div th:fragment="header">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Navbar -->
    <div class="container-fluid border border-dark border-2 mt-2">

        <div class="row bg-info-subtle py-3 px-4">

            <div class="col d-flex justify-content-between align-items-center">

                <form th:action="@{/logout}" method="post">

                    <button type="submit"
                            class="btn btn-dark rounded-0 px-5 py-2 fw-bold">
                        Logout
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

</body>
</html>
