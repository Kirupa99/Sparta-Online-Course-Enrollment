<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      class="h-100">

<head>
    <meta charset="UTF-8">
    <title>Trainee Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

<!-- Header -->
<div th:replace="~{fragments/header :: header}"></div>

<!-- Main Content -->
<main class="flex-grow-1 container py-5">

    <!-- Welcome Section -->
    <div th:replace="~{fragments/welcome :: welcome}"></div>

    <!-- Dashboard Cards -->
    <div class="row justify-content-center g-4">

        <!-- Courses Card -->
        <div class="col-md-4">

            <div class="card text-center shadow-sm h-100 border-0 rounded-4">

                <div class="card-body p-4">

                    <div class="display-3 mb-3">
                        🎓
                    </div>

                    <h3 class="card-title fw-bold">
                        Your Enrolled Courses
                    </h3>

                    <p class="card-text text-muted">
                        View and continue your enrolled training courses.
                    </p>

                    <a th:href="@{/trainees/courses}"
                       class="btn btn-danger mt-3 px-4">

                        Access Now

                    </a>

                </div>

            </div>

        </div>

    </div>

</main>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
