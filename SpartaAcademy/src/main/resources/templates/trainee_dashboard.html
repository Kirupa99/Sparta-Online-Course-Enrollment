<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<body class="bg-white">

<!-- Header -->
<div th:replace="~{fragments/header :: header}"></div>

<div class="container-fluid border border-dark border-2 min-vh-100 mt-3">

    <!-- Main Content -->
    <div class="container py-5">

        <!-- Greeting -->
        <div class="mb-5">

            <h2 class="fw-bold">
                Hi,
                <span th:text="${username}">Mark</span>
            </h2>

        </div>

        <!-- Title -->
        <div class="text-center mb-5">

            <h1 class="fw-bold">
                Welcome to the Sparta Course Enrollment
            </h1>

        </div>

        <!-- Dashboard Buttons -->
        <div class="d-flex justify-content-center gap-5 flex-wrap mt-5">

            <!-- View Enrolled Course -->
            <a th:href="@{/trainee/course}">

                <button class="btn btn-dark rounded-0 px-5 py-3 fw-bold">
                    View Enrolled Course
                </button>

            </a>

            <!-- Update Profile -->
            <a th:href="@{/profile/update}">

                <button class="btn btn-dark rounded-0 px-5 py-3 fw-bold">
                    Update User Profile
                </button>

            </a>

        </div>

    </div>

</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
