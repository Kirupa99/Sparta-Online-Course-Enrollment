<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>All Trainees</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<!-- Header -->
<div th:replace="~{fragments/header :: header}"></div>

<div class="container py-5">

    <!-- Page Title -->
    <div class="text-center mb-5">

        <h1 class="fw-bold">
            All Trainees
        </h1>

        <p class="text-muted">
            View all trainee Spartans in the academy.
        </p>

    </div>

    <!-- Search + Back Button -->
    <div class="row mb-4 align-items-center">

        <!-- Search -->
        <div class="col-md-8">

            <form th:action="@{/trainer/view_trainees}" method="get">

                <div class="input-group shadow-sm">

                    <input type="text"
                           name="keyword"
                           class="form-control"
                           placeholder="Search trainee by name or email..."
                           th:value="${keyword}">

                    <button class="btn btn-danger"
                            type="submit">
                        Search
                    </button>

                </div>

            </form>

        </div>

        <!-- Back Button -->
        <div class="col-md-4 text-end">

            <a th:href="@{/dashboard}"
               class="btn btn-dark">
                ← Back to Dashboard
            </a>

        </div>

    </div>

    <!-- Table Card -->
    <div class="card shadow-sm border-0">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-hover table-bordered align-middle mb-0">

                    <thead class="table-dark">

                    <tr>

                        <th>ID</th>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Email</th>
                        <th>City</th>
                        <th>Enrolled Date</th>
                        <th>Course</th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr th:if="${#lists.isEmpty(trainees)}">

                        <td colspan="7"
                            class="text-center text-muted py-4">
                            No trainees found.
                        </td>

                    </tr>

                    <tr th:each="trainee : ${trainees}">

                        <td th:text="${trainee.traineeId}">1</td>

                        <td th:text="${trainee.firstName}">Alice</td>

                        <td th:text="${trainee.lastName}">Smith</td>

                        <td th:text="${trainee.email}">alice@sparta.com</td>

                        <td th:text="${trainee.city}">London</td>

                        <td th:text="${trainee.enrolledDate}">2026-05-15</td>

                        <td th:text="${trainee.courseName}">Java Development</td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
