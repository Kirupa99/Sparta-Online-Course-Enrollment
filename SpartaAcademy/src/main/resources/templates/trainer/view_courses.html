<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      class="h-100">

<head>
    <meta charset="UTF-8">
    <title>All Courses</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

<div th:replace="~{fragments/header :: header}"></div>

<main class="flex-grow-1">

    <div class="container py-5">

        <div class="text-center mb-5">

            <div th:if="${isTrainer and not isMyCourses}">
                <h1 class="fw-bold">All Courses</h1>
                <p class="text-muted">View all available courses in the academy.</p>
            </div>

            <div th:if="${isMyCourses}">
                <h1 class="fw-bold">My Courses</h1>
                <p class="text-muted">View your courses.</p>
            </div>

        </div>

        <div class="row mb-4 align-items-center">

            <div class="col-md-8">

                <form th:if="${isTrainer and not isMyCourses}"
                      th:action="@{/trainer/view_courses}"
                      method="get">

                    <div class="input-group shadow-sm">
                        <input type="text"
                               name="keyword"
                               class="form-control"
                               placeholder="Search course by name..."
                               th:value="${keyword}">

                        <button class="btn btn-danger" type="submit">
                            Search
                        </button>
                    </div>

                </form>

                <form th:if="${isTrainer and isMyCourses}"
                      th:action="@{/trainer/mycourses}"
                      method="get">

                    <div class="input-group shadow-sm">
                        <input type="text"
                               name="keyword"
                               class="form-control"
                               placeholder="Search your courses..."
                               th:value="${keyword}">

                        <button class="btn btn-danger" type="submit">
                            Search
                        </button>
                    </div>

                </form>

                <form th:unless="${isTrainer}"
                      th:action="@{/trainees/courses}"
                      method="get">

                    <div class="input-group shadow-sm">
                        <input type="text"
                               name="keyword"
                               class="form-control"
                               placeholder="Search your enrolled courses..."
                               th:value="${keyword}">

                        <button class="btn btn-danger" type="submit">
                            Search
                        </button>
                    </div>

                </form>

            </div>

            <div class="col-md-4 text-end">

                <a th:if="${isTrainer and not isMyCourses}"
                   th:href="@{/course/create_course}"
                   class="btn btn-success me-2">
                    ➕📘 Create Course
                </a>

                <a th:href="@{/dashboard}"
                   class="btn btn-dark">
                    ← Back to Dashboard
                </a>

            </div>

        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body">
                <div class="table-responsive">

                    <table class="table table-hover table-bordered align-middle mb-0">

                        <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Description</th>
                            <th>Start Date</th>
                            <th>End Date</th>
                            <th th:if="${isTrainer}">Max Students</th>
                            <th>Trainers</th>
                            <th th:if="${isTrainer and not isMyCourses}">Actions</th>
                        </tr>
                        </thead>

                        <tbody>

                        <tr th:if="${#lists.isEmpty(courses)}">
                            <td th:attr="colspan=${isTrainer} ? 8 : 6"
                                class="text-center text-muted py-4">
                                No courses found.
                            </td>
                        </tr>

                        <tr th:each="course : ${courses}">
                            <td th:text="${course.courseId}"></td>

                            <td>
                                <a th:if="${isTrainer and not isMyCourses}"
                                   th:href="@{/trainer/courses/{id}(id=${course.courseId})}"
                                   th:text="${course.courseName}">
                                </a>

                                <a th:if="${isTrainer and isMyCourses}"
                                   th:href="@{/trainer/mycourses/{id}(id=${course.courseId})}"
                                   th:text="${course.courseName}">
                                </a>

                                <a th:unless="${isTrainer}"
                                   th:href="@{/trainees/courses/{id}(id=${course.courseId})}"
                                   th:text="${course.courseName}">
                                </a>
                            </td>

                            <td th:text="${course.description}"></td>
                            <td th:text="${course.startDate}"></td>
                            <td th:text="${course.endDate}"></td>

                            <td th:if="${isTrainer}"
                                th:text="${course.maxStudents}">
                            </td>

                            <td>
                                <span th:if="${course.trainerNames == null || #lists.isEmpty(course.trainerNames)}">
                                    No trainer assigned
                                </span>

                                <span th:each="trainerName, iterStat : ${course.trainerNames}">
                                    <span th:text="${trainerName}">Trainer Name</span>
                                    <span th:if="${!iterStat.last}">, </span>
                                </span>
                            </td>

                            <td th:if="${isTrainer and not isMyCourses}">
                                <a th:href="@{/trainer/edit_course/{id}(id=${course.courseId})}"
                                   class="btn btn-warning btn-sm fw-bold">
                                    ✏️ Update Course
                                </a>
                            </td>
                        </tr>

                        </tbody>
                    </table>

                </div>
            </div>
        </div>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
