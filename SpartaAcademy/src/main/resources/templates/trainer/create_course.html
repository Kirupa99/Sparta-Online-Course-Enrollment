<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Course</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/header :: header}"></div>

<div class="container py-5">

    <h1 class="fw-bold mb-4">Create Course</h1>

    <div th:if="${error}">
        <p th:text="${error}" style="color: red;"></p>
    </div>

    <form action="/course/create_course" method="post">

        <div class="mb-3">
            <label class="form-label">Course Name</label>
            <input type="text" name="courseName" class="form-control" required/>
        </div>

        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control" rows="4"></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Start Date</label>
            <input type="date" name="startDate" class="form-control" required/>
        </div>

        <div class="mb-3">
            <label class="form-label">End Date</label>
            <input type="date" name="endDate" class="form-control" required/>
        </div>

        <div class="mb-3">
            <label class="form-label">Max Students</label>
            <input type="number" name="maxStudents" class="form-control" min="1" required/>
        </div>

        <div class="mb-3">
            <label class="form-label">Assign Trainers (optional)</label>
            <select name="trainerIds" class="form-select" multiple>
                <option th:each="trainer : ${trainers}"
                        th:value="${trainer.trainerId}"
                        th:text="${trainer.firstName + ' ' + trainer.lastName}">
                </option>
            </select>
            <small class="text-muted">Hold Ctrl (Windows) or Cmd (Mac) to select multiple trainers.</small>
        </div>

        <button type="submit" class="btn btn-success">Create Course</button>
        <a href="/trainer/view_courses" class="btn btn-dark ms-2">Cancel</a>

    </form>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
