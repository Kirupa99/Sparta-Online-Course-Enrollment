<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Edit Course</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<!-- Header -->
<div th:replace="~{fragments/header :: header}"></div>

<div class="container py-5">

    <!-- Page Title -->
    <div class="text-center mb-5">

        <h1 class="fw-bold">
            ✏️ Edit Course
        </h1>

        <p class="text-muted">
            Update course information and assigned trainers.
        </p>

    </div>

    <!-- Form Card -->
    <div class="card shadow-lg border-0 rounded-4">

        <div class="card-body p-5">

            <!-- Error Message -->
            <div th:if="${error}"
                 class="alert alert-danger text-center">

                <span th:text="${error}"></span>

            </div>

            <!-- Form -->
            <form th:action="@{/trainer/edit_course/{id}(id=${course.courseId})}"
                  method="post">

                <!-- Course Name -->
                <div class="mb-4">

                    <label class="form-label fw-semibold">
                        Course Name
                    </label>

                    <input type="text"
                           name="courseName"
                           class="form-control form-control-lg"
                           th:value="${course.courseName}"
                           placeholder="Enter course name"
                           required>

                </div>

                <!-- Description -->
                <div class="mb-4">

                    <label class="form-label fw-semibold">
                        Description
                    </label>

                    <textarea name="description"
                              rows="4"
                              class="form-control"
                              placeholder="Enter course description"
                              th:text="${course.description}">
                    </textarea>

                </div>

                <!-- Dates -->
                <div class="row">

                    <!-- Start Date -->
                    <div class="col-md-6 mb-4">

                        <label class="form-label fw-semibold">
                            Start Date
                        </label>

                        <input type="date"
                               name="startDate"
                               class="form-control form-control-lg"
                               th:value="${course.startDate}"
                               required>

                    </div>

                    <!-- End Date -->
                    <div class="col-md-6 mb-4">

                        <label class="form-label fw-semibold">
                            End Date
                        </label>

                        <input type="date"
                               name="endDate"
                               class="form-control form-control-lg"
                               th:value="${course.endDate}"
                               required>

                    </div>

                </div>

                <!-- Max Students -->
                <div class="mb-4">

                    <label class="form-label fw-semibold">
                        Max Students
                    </label>

                    <input type="number"
                           name="maxStudents"
                           class="form-control form-control-lg"
                           th:value="${course.maxStudents}"
                           min="1"
                           placeholder="Enter maximum students">

                </div>

                <!-- Trainers -->
                <div class="mb-4">

                    <label class="form-label fw-semibold">
                        Assign Trainers
                    </label>

                    <select name="trainerIds"
                            class="form-select form-select-lg"
                            multiple>

                        <option th:each="trainer : ${trainers}"
                                th:value="${trainer.trainerId}"
                                th:text="${trainer.firstName + ' ' + trainer.lastName}">
                        </option>

                    </select>

                    <div class="form-text">
                        Hold Ctrl (Windows) or Cmd (Mac) to select multiple trainers.
                    </div>

                </div>

                <!-- Buttons -->
                <div class="d-flex gap-3">

                    <button type="submit"
                            class="btn btn-warning fw-bold">

                        💾 Save Changes

                    </button>

                    <a href="/trainer/view_courses"
                       class="btn btn-outline-dark">

                        Cancel

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
