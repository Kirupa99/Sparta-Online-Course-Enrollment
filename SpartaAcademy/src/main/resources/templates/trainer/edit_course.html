<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Course</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<h1>Edit Course</h1>

<p th:if="${error}" style="color: red;" th:text="${error}"></p>

<form th:action="@{/trainer/edit_course/{id}(id=${course.courseId})}" method="post">

    <label>Course Name:</label><br>
    <input type="text" name="courseName" th:value="${course.courseName}" required/><br><br>

    <label>Description:</label><br>
    <textarea name="description" rows="3" th:text="${course.description}"></textarea><br><br>

    <label>Start Date:</label><br>
    <input type="date" name="startDate" th:value="${course.startDate}" required/><br><br>

    <label>End Date:</label><br>
    <input type="date" name="endDate" th:value="${course.endDate}" required/><br><br>

    <label>Max Students:</label><br>
    <input type="number" name="maxStudents" th:value="${course.maxStudents}" min="1"/><br><br>

    <div class="mb-3">
        <label class="form-label">Assign Trainers (optional)</label>
        <select name="trainerIds" class="form-select" multiple>
            <option th:each="trainer : ${trainers}"
                    th:value="${trainer.trainerId}"
                    th:text="${trainer.firstName + ' ' + trainer.lastName}">
            </option>
        </select>
        <small class="text-muted">Hold Ctrl (Windows) or Cmd (Mac) to select multiple trainers.</small>
    </div>

    <button type="submit">Save Changes</button>
    <a href="/trainer/view_courses">Cancel</a>

</form>

</body>
</html>
