<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>My Profile</title>
</head>

<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragments/header :: header}"></div>

<main class="flex-grow-1">

<div style="padding: 40px;">

    <h1 class="fw-bold mb-4">My Profile</h1>

    <div class="mb-3">
        <label class="form-label">First Name</label>
        <input type="text" class="form-control" th:value="${trainee.firstName}" disabled/>
    </div>

    <div class="mb-3">
        <label class="form-label">Last Name</label>
        <input type="text" class="form-control" th:value="${trainee.lastName}" disabled/>
    </div>

    <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="text" class="form-control" th:value="${trainee.email}" disabled/>
    </div>

    <div class="mb-3">
        <label class="form-label">City</label>
        <input type="text" class="form-control"
               th:value="${trainee.city != null} ? ${trainee.city} : 'Not provided'" disabled/>
    </div>

    <div class="mb-3">
        <label class="form-label">Enrolled Date</label>
        <input type="text" class="form-control" th:value="${trainee.enrolledDate}" disabled/>
    </div>

    <div class="mb-3">
        <label class="form-label">Enrolled Course</label>
        <input type="text" class="form-control"
               th:value="${trainee.courseName != null} ? ${trainee.courseName} : 'Not enrolled in a course'" disabled/>
    </div>

    <a th:href="@{/dashboard}" class="btn btn-dark">← Back to Dashboard</a>

</div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
