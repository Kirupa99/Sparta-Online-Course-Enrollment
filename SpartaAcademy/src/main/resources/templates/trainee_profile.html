<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>My Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div th:replace="~{fragments/header :: header}"></div>

<div class="container py-5">

    <h1 class="fw-bold mb-4">My Profile</h1>

    <div th:if="${success}">
        <p th:text="${success}" style="color: green;"></p>
    </div>

    <div th:if="${error}">
        <p th:text="${error}" style="color: red;"></p>
    </div>

    <form th:action="@{/trainees/profile}" method="post">

        <div class="mb-3">
            <label class="form-label">First Name</label>
            <input type="text" name="firstName" class="form-control"
                   th:value="${trainee.firstName}" required/>
        </div>

        <div class="mb-3">
            <label class="form-label">Last Name</label>
            <input type="text" name="lastName" class="form-control"
                   th:value="${trainee.lastName}" required/>
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control"
                   th:value="${trainee.email}" required/>
        </div>

        <div class="mb-3">
            <label class="form-label">City</label>
            <input type="text" name="city" class="form-control"
                   th:value="${trainee.city}"/>
        </div>

        <div class="mb-3">
            <label class="form-label">Enrolled Course</label>
            <input type="text" class="form-control"
                   th:value="${trainee.courseName != null} ? ${trainee.courseName} : 'Not enrolled in a course'" disabled/>
        </div>

        <div class="mb-3">
            <label class="form-label">New Password (leave blank to keep current)</label>
            <input type="password" name="password" class="form-control"/>
        </div>

        <button type="submit" class="btn btn-success">Save Changes</button>
        <a th:href="@{/dashboard}" class="btn btn-dark ms-2">Cancel</a>

    </form>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
