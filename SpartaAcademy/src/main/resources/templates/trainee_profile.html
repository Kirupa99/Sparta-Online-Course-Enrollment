<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>My Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div th:replace="~{fragments/header :: header}"></div>

<div class="container py-5">

    <h1 class="fw-bold mb-4">My Profile</h1>

    <div class="mb-3">
        <label class="form-label">First Name</label>
        <input type="text" class="form-control" th:value="${trainee.firstName}" disabled/>
    </div>

    <div class="mb-3">
        <label class="form-label">Last Name</label>
        <input type="text" class="form-control" th:value="${trainee.lastName}" disabled/>
    </div>

    <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="text" class="form-control" th:value="${trainee.email}" disabled/>
    </div>

    <div class="mb-3">
        <label class="form-label">City</label>
        <input type="text" class="form-control"
               th:value="${trainee.city != null} ? ${trainee.city} : 'Not provided'" disabled/>
    </div>

    <div class="mb-3">
        <label class="form-label">Enrolled Date</label>
        <input type="text" class="form-control" th:value="${trainee.enrolledDate}" disabled/>
    </div>

    <div class="mb-3">
        <label class="form-label">Enrolled Course</label>
        <input type="text" class="form-control"
               th:value="${trainee.courseName != null} ? ${trainee.courseName} : 'Not enrolled in a course'" disabled/>
    </div>

    <a th:href="@{/dashboard}" class="btn btn-dark">← Back to Dashboard</a>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
